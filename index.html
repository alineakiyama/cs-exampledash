<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS Reporting</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239085e9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="brand__mark">CS</span>
    <div>
      <div class="brand__name">CS Reporting</div>
      <div class="brand__stores" id="brand-stores"></div>
    </div>
  </div>
  <div class="meta">
    <dl><dt>Data set</dt><dd id="meta-range"></dd></dl>
    <dl><dt>Generated</dt><dd id="meta-generated"></dd></dl>
    <dl><dt>Timezone</dt><dd>America/Sao_Paulo</dd></dl>
    <button class="btn" id="theme" type="button">Theme: dark</button>
  </div>
</header>

<div class="toolbar">
  <nav class="tabs" aria-label="Sections">
    <button class="tab is-on" data-view="overview" type="button">Overview</button>
    <button class="tab" data-view="chargebacks" type="button">Chargebacks</button>
    <button class="tab" data-view="reviews" type="button">Trustpilot</button>
  </nav>
  <div class="filters filters--period">
    <span class="filters__label">Period</span>
    <div class="seg" id="presets"></div>
    <form class="range" id="range" novalidate>
      <input type="date" id="from" aria-label="From">
      <span class="hint">–</span>
      <input type="date" id="to" aria-label="To">
      <button class="btn btn--primary" type="submit" id="apply">Apply</button>
      <button class="btn" type="button" id="reset">Reset</button>
    </form>
    <span class="hint" id="hint" aria-live="polite"></span>
  </div>
  <div class="filters filters--store">
    <span class="filters__label">Store</span>
    <div class="seg" id="stores"></div>
  </div>
</div>

<p class="demo"><b>Demo.</b> Every number on this page is generated by a script with a fixed seed — no real store, customer or order data.</p>

<main class="content" id="content"></main>

<div class="tooltip" id="tooltip" role="status" hidden></div>

<script src="assets/data.js"></script>
<script src="assets/metrics.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
